[project]
name = "agent-harness"
version = "0.4.0"
description = "Plugin-based AI agent orchestration harness — FastAPI backend with tiered routing and sub-agent spawning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "deepagents>=0.7.0",
    "firecrawl-py>=4.0.0",
    "fpdf2>=2.8.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
azure = [
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.15.0",
]
snowflake = [
    "snowflake-connector-python>=3.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]
all = [
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.15.0",
    "snowflake-connector-python>=3.12.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
harness-serve = "harness.serve:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "build", "dist"]
asyncio_mode = "auto"
