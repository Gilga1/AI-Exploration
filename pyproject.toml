[project]
name = "qwen-agentic-ft"
version = "0.1.0"
description = "Fine-tune Qwen3.5-2B on LangChain/LangGraph/Deep Agents code patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
train = [
    "unsloth",
    "transformers>=5.0.0",
    "trl>=0.15.0",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "accelerate>=1.2.0",
]
agents = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "deepagents>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
qwen-extract = "qwen_agentic_ft.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "build", "dist"]
