name: AI Agent Harness
config_root: harness
scan_paths:
  - harness/tools
  - harness/skills
  - harness/agents
  - harness/connectors
strict_sandbox_validation: true
connector_health_check: true
connector_fail_fast: false
routing_top_k: 5
routing_clear_margin: 0.15
routing_min_score: 0.2
routing_use_llm: false
telemetry_content_sample_rate: 0.0
telemetry_enable_otel: true
telemetry_enable_ledger: true
telemetry_ledger_db_path: data/harness_events.db
episodic_db_path: data/harness_episodic.db
approvals_db_path: data/harness_approvals.db
force_stub_models: false
langfuse_enabled: true
mcp_enabled: true
orchestration_mode: auto
orchestration_require_plan_approval: true
orchestration_max_tasks: 5
orchestration_synthesizer_agent: synthesizer
orchestration_continue_on_failure: true
orchestration_fast_path_single_task: true
orchestration_parallel: true
orchestration_max_parallel: 3
orchestration_failure_policy: continue
orchestration_planner: auto
orchestration_workflow_match_threshold: 0.6
orchestration_plans_db_path: data/harness_plans.db
host: 0.0.0.0
port: 8000
