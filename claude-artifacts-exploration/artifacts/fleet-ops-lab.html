<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Ops — Claude Artifact Lab</title>
  <!--
    Paste this file into Claude as an artifact, or open via preview/index.html.
    Outside Claude, the optional script below installs a mock window.claude / storage.
    Inside Claude, that URL 404s (or is CSP-blocked) and Anthropic’s inject bridge wins.
  -->
  <script src="/preview/mock-bridge.js"></script>
  <style>
    :root {
      --ink: #1a2332;
      --muted: #5b6b7c;
      --paper: #f3f6f4;
      --panel: #ffffff;
      --line: #d5dde6;
      --accent: #0f6e56;
      --accent-soft: #d8f3ea;
      --warn: #b45309;
      --warn-soft: #fff7ed;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --yard: #475467;
      --shadow: 0 10px 30px rgba(26, 35, 50, 0.08);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 420ms;
      --delay: 0ms;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #dceee6 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #e7eef8 0%, transparent 50%),
        var(--paper);
      min-height: 100vh;
    }
    .shell { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
    header.app-head {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
      justify-content: space-between; margin-bottom: 18px;
    }
    .brand { font-size: 1.55rem; font-weight: 750; letter-spacing: -0.03em; }
    .sub { color: var(--muted); font-size: 0.92rem; max-width: 42rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.75rem; color: var(--accent); background: var(--accent-soft);
      padding: 4px 10px; border-radius: 999px;
    }
    .badge.dot::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); animation: pulse 1.6s var(--ease) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    nav.tabs {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
      border-bottom: 1px solid var(--line); padding-bottom: 10px;
    }
    .tab {
      border: 1px solid transparent; background: transparent; color: var(--muted);
      padding: 8px 12px; border-radius: 10px; cursor: pointer; font: inherit;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
        border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
      transition-delay: var(--delay);
    }
    .tab:hover { background: #e8eef5; color: var(--ink); }
    .tab.active {
      background: var(--panel); border-color: var(--line); color: var(--ink);
      box-shadow: var(--shadow); transform: translateY(-1px);
    }

    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px; box-shadow: var(--shadow);
      animation: enter var(--dur) var(--ease) both;
      animation-delay: var(--delay);
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid { display: grid; gap: 12px; }
    .grid.kpi { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .kpi {
      padding: 12px; border-radius: 12px; background: #f7faf8; border: 1px solid var(--line);
      transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .kpi:hover { transform: translateY(-2px); background: #eef7f2; }
    .kpi .label { font-size: 0.75rem; color: var(--muted); }
    .kpi .value { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button.btn, .seg button {
      font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; padding: 8px 12px; color: var(--ink);
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }
    button.btn:hover, .seg button:hover { background: #f3f7f5; }
    button.btn:active, .seg button:active { transform: scale(0.98); }
    button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.btn.primary:hover { filter: brightness(1.05); }
    button.btn:disabled { opacity: 0.55; cursor: wait; }

    .seg { display: inline-flex; padding: 3px; gap: 2px; background: #eef2f6; border-radius: 12px; }
    .seg button.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute; z-index: 5; left: 50%; bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      background: var(--ink); color: #fff; font-size: 0.72rem; line-height: 1.3;
      padding: 6px 8px; border-radius: 8px; width: max-content; max-width: 220px;
      opacity: 0; pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    [data-tip]:hover::after, [data-tip]:focus-visible::after {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr.van-row { cursor: pointer; transition: background 140ms ease; }
    tr.van-row:hover { background: #f5faf7; }
    tr.van-row.selected { background: var(--accent-soft); }

    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    .pill.delayed { background: var(--danger-soft); color: var(--danger); }
    .pill.on_time { background: var(--accent-soft); color: var(--accent); }
    .pill.yard { background: #eef2f6; color: var(--yard); }

    .board {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
    }
    @media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
    .col {
      background: #f7f9fb; border: 1px dashed var(--line); border-radius: 12px; min-height: 180px; padding: 8px;
    }
    .col h4 { margin: 4px 6px 8px; font-size: 0.8rem; color: var(--muted); }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
      margin-bottom: 8px; cursor: grab; user-select: none;
      transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
      transition-delay: var(--delay);
    }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: 0.55; transform: scale(0.98); }
    .col.drag-over { background: var(--accent-soft); border-color: var(--accent); }

    .motion-stage {
      height: 120px; border-radius: 14px; background: linear-gradient(120deg, #0f6e56, #1d4e89);
      position: relative; overflow: hidden; margin: 12px 0;
    }
    .orb {
      position: absolute; top: 36px; left: 24px; width: 48px; height: 48px; border-radius: 50%;
      background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.25);
      animation: slide var(--dur) var(--ease) infinite alternate;
      animation-delay: var(--delay);
    }
    @keyframes slide {
      from { transform: translateX(0); }
      to { transform: translateX(220px) scale(1.08); }
    }

    label.ctrl { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); min-width: 140px; }
    input[type="range"] { width: 100%; }
    textarea, input[type="text"] {
      width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff;
    }
    .chat {
      display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow: auto;
      padding: 8px; background: #f7f9fb; border-radius: 12px; border: 1px solid var(--line);
    }
    .bubble {
      max-width: 90%; padding: 8px 10px; border-radius: 12px; font-size: 0.9rem;
      animation: enter 220ms var(--ease) both;
    }
    .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; }
    .bubble.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--line); }
    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem; background: #0f1720; color: #d7e2ef;
      border-radius: 12px; padding: 10px; max-height: 180px; overflow: auto; white-space: pre-wrap;
    }
    .callout {
      border-left: 3px solid var(--accent); padding: 8px 12px; background: #f3faf7;
      border-radius: 0 10px 10px 0; color: var(--muted); font-size: 0.88rem;
    }
    .split { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 12px; }
    @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="root" class="shell">Loading artifact…</div>

  <script>
    // ---- mock data (mirrors src/mock-data.ts) ----
    const VANS = [
      { id: "V-104", region: "SOMA", status: "delayed", delayMinutes: 18, reason: "Double-parked on Folsom", driver: "A. Chen", lastPing: "2026-10-27T04:12:00Z" },
      { id: "V-221", region: "Mission", status: "on_time", delayMinutes: 0, reason: null, driver: "M. Ortiz", lastPing: "2026-10-27T04:14:00Z" },
      { id: "V-318", region: "Sunset", status: "yard", delayMinutes: 0, reason: null, driver: "R. Singh", lastPing: "2026-10-27T03:55:00Z" },
      { id: "V-407", region: "SOMA", status: "on_time", delayMinutes: 2, reason: null, driver: "J. Park", lastPing: "2026-10-27T04:15:00Z" },
      { id: "V-512", region: "Mission", status: "delayed", delayMinutes: 27, reason: "Loading dock queue at 16th", driver: "L. Nguyen", lastPing: "2026-10-27T04:10:00Z" },
    ];
    const REGION_KPIS = [
      { region: "SOMA", onTimePct: 84.2, openIncidents: 2, activeVans: 14 },
      { region: "Mission", onTimePct: 91.0, openIncidents: 1, activeVans: 11 },
      { region: "Sunset", onTimePct: 88.5, openIncidents: 0, activeVans: 9 },
    ];
    const FLEET_SUMMARY = { onTimePct: 87.4, openIncidents: 3, delayedCount: 2, asOf: "2026-10-27T04:15:00Z" };

    const TABS = [
      { id: "overview", label: "Overview" },
      { id: "interactions", label: "Interactions" },
      { id: "transitions", label: "Transitions" },
      { id: "followup", label: "Follow-up API" },
      { id: "events", label: "Dynamic events" },
      { id: "storage", label: "Storage" },
    ];

    const state = {
      tab: location.hash.replace("#", "") || "overview",
      region: "All",
      selectedId: null,
      board: {
        Now: ["V-104", "V-512"],
        Next: ["V-221"],
        Later: ["V-318", "V-407"],
      },
      dragId: null,
      durationMs: 420,
      delayMs: 0,
      easing: "ease",
      history: [
        { role: "user", content: "We have two delayed vans in SOMA/Mission. What should dispatch prioritize?" },
        { role: "assistant", content: "Stabilize V-512 first (27m), then clear Folsom blockage for V-104." },
      ],
      draft: "",
      busy: false,
      apiLog: [],
      liveTick: 0,
      autoRefresh: false,
      storageNote: "",
      bridge: typeof window.claude?.complete === "function" ? (window.__CLAUDE_ARTIFACT_BRIDGE__ || "claude") : "missing",
    };

    function $(sel, el = document) { return el.querySelector(sel); }
    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "className") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : String(v));
      }
      for (const c of [].concat(children)) {
        if (c == null || c === false) continue;
        node.append(typeof c === "string" ? document.createTextNode(c) : c);
      }
      return node;
    }

    function applyMotionVars() {
      document.documentElement.style.setProperty("--dur", state.durationMs + "ms");
      document.documentElement.style.setProperty("--delay", state.delayMs + "ms");
      const map = { ease: "cubic-bezier(0.22, 1, 0.36, 1)", linear: "linear", springy: "cubic-bezier(0.34, 1.56, 0.64, 1)" };
      document.documentElement.style.setProperty("--ease", map[state.easing] || map.ease);
    }

    function filteredVans() {
      return state.region === "All" ? VANS : VANS.filter((v) => v.region === state.region);
    }

    function log(line) {
      const stamp = new Date().toISOString().slice(11, 19);
      state.apiLog = [`[${stamp}] ${line}`, ...state.apiLog].slice(0, 40);
    }

    async function callClaudeComplete(extraUserText) {
      if (!window.claude?.complete) {
        log("window.claude.complete missing — load mock-bridge or open inside Claude");
        return;
      }
      state.busy = true; render();
      const history = [...state.history];
      if (extraUserText) history.push({ role: "user", content: extraUserText });

      const prompt = `The following is the COMPLETE conversation history. You MUST consider ALL of these messages when formulating your response:
${JSON.stringify(history)}

Current fleet snapshot: ${JSON.stringify(FLEET_SUMMARY)}
Board: ${JSON.stringify(state.board)}

Respond with a JSON object only:
{"response":"...","sentiment":"..."}
DO NOT OUTPUT ANYTHING OTHER THAN VALID JSON.`;

      try {
        const raw = await window.claude.complete(prompt);
        log("complete() → " + String(raw).slice(0, 180));
        let parsed;
        try { parsed = JSON.parse(raw); } catch { parsed = { response: raw, sentiment: "n/a" }; }
        if (extraUserText) state.history.push({ role: "user", content: extraUserText });
        state.history.push({ role: "assistant", content: parsed.response || String(raw) });
      } catch (err) {
        log("complete() error: " + err.message);
      } finally {
        state.busy = false; render();
      }
    }

    async function callMessagesApi(extraUserText) {
      state.busy = true; render();
      const messages = [...state.history];
      if (extraUserText) messages.push({ role: "user", content: extraUserText });
      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 400,
            system: "Fleet ops coach. Reply with JSON {response, sentiment} only.",
            messages,
          }),
        });
        const data = await response.json();
        const text = data?.content?.[0]?.text || JSON.stringify(data);
        log("fetch Messages → " + text.slice(0, 180));
        let parsed;
        try { parsed = JSON.parse(text); } catch { parsed = { response: text }; }
        if (extraUserText) state.history.push({ role: "user", content: extraUserText });
        state.history.push({ role: "assistant", content: parsed.response || text });
      } catch (err) {
        log("fetch Messages error: " + err.message);
      } finally {
        state.busy = false; render();
      }
    }

    async function saveStorage(shared) {
      if (!window.storage?.set) {
        state.storageNote = "window.storage missing";
        render(); return;
      }
      const payload = { board: state.board, region: state.region, savedAt: new Date().toISOString() };
      try {
        await window.storage.set("fleet-ops-lab", payload, shared);
        state.storageNote = `Saved ${shared ? "shared" : "personal"} @ ${payload.savedAt}`;
        log(`storage.set(shared=${shared}) ok`);
      } catch (err) {
        state.storageNote = "Save failed: " + err.message;
        log("storage.set error: " + err.message);
      }
      render();
    }

    async function loadStorage(shared) {
      if (!window.storage?.get) {
        state.storageNote = "window.storage missing";
        render(); return;
      }
      try {
        const row = await window.storage.get("fleet-ops-lab", shared);
        const value = typeof row.value === "string" ? JSON.parse(row.value) : row.value;
        if (value?.board) state.board = value.board;
        if (value?.region) state.region = value.region;
        state.storageNote = `Loaded ${shared ? "shared" : "personal"}`;
        log(`storage.get(shared=${shared}) ok`);
      } catch (err) {
        state.storageNote = "Load failed: " + err.message;
        log("storage.get error: " + err.message);
      }
      render();
    }

    function copyBoardPrompt() {
      const text = `Update our dispatch plan using this triage board JSON:\n${JSON.stringify(state.board, null, 2)}\nPrioritize delayed vans and return a short ops plan.`;
      navigator.clipboard?.writeText(text);
      log("Copied board → clipboard (paste into Claude chat for authoring follow-up)");
      state.storageNote = "Board prompt copied — paste into the host chat";
      render();
    }

    // ---- views ----
    function viewOverview() {
      return el("div", { className: "panel" }, [
        el("div", { className: "callout", text: "Artifact runtime ≠ MCP Apps. This lab mocks window.claude / window.storage locally; inside Claude those APIs are injected." }),
        el("div", { className: "row", style: "margin:12px 0;gap:10px;" }, [
          el("span", { className: "badge dot", text: "bridge: " + state.bridge }),
          el("span", { className: "badge", text: "tick " + state.liveTick }),
        ]),
        el("div", { className: "grid kpi" }, [
          kpi("On-time %", FLEET_SUMMARY.onTimePct.toFixed(1)),
          kpi("Open incidents", String(FLEET_SUMMARY.openIncidents)),
          kpi("Delayed vans", String(FLEET_SUMMARY.delayedCount)),
          kpi("As of (UTC)", FLEET_SUMMARY.asOf.slice(11, 16)),
        ]),
        el("h3", { text: "Regions" }),
        el("div", { className: "grid kpi" }, REGION_KPIS.map((r) =>
          kpi(r.region, r.onTimePct.toFixed(1) + "%", `${r.activeVans} vans · ${r.openIncidents} incidents`)
        )),
      ]);
    }

    function kpi(label, value, tip) {
      const node = el("div", { className: "kpi", ...(tip ? { "data-tip": tip, tabindex: "0" } : {}) }, [
        el("div", { className: "label", text: label }),
        el("div", { className: "value", text: value }),
      ]);
      return node;
    }

    function viewInteractions() {
      const vans = filteredVans();
      const selected = VANS.find((v) => v.id === state.selectedId);
      return el("div", { className: "panel split" }, [
        el("div", {}, [
          el("div", { className: "row", style: "margin-bottom:10px;" }, [
            el("div", { className: "seg" }, ["All", "SOMA", "Mission", "Sunset"].map((r) =>
              el("button", {
                className: state.region === r ? "active" : "",
                text: r,
                type: "button",
                "data-tip": "Segmented filter — preferred over menus",
                onClick: () => { state.region = r; render(); },
              })
            )),
          ]),
          el("table", {}, [
            el("thead", {}, [el("tr", {}, ["Van", "Region", "Status", "Delay"].map((h) => el("th", { text: h })))]),
            el("tbody", {}, vans.map((v) =>
              el("tr", {
                className: "van-row" + (state.selectedId === v.id ? " selected" : ""),
                onClick: () => { state.selectedId = v.id; render(); },
              }, [
                el("td", { text: v.id }),
                el("td", { text: v.region }),
                el("td", {}, [el("span", { className: "pill " + v.status, text: v.status })]),
                el("td", { text: v.delayMinutes ? v.delayMinutes + "m" : "—" }),
              ])
            )),
          ]),
        ]),
        el("div", {}, [
          el("h3", { text: selected ? selected.id : "Select a van" }),
          selected
            ? el("div", {}, [
                el("p", { text: `${selected.driver} · ${selected.region}` }),
                el("p", { text: selected.reason || "No delay reason" }),
                el("button", {
                  className: "btn",
                  type: "button",
                  "data-tip": "Hover/focus tooltip demo",
                  text: "Ping last seen",
                  onClick: () => { log("tooltip button → lastPing " + selected.lastPing); render(); },
                }),
              ])
            : el("p", { className: "sub", text: "Click a row. Selection is in-memory React-style state — the host chat does not see it unless you export." }),
          el("h4", { text: "Drag triage board" }),
          boardView(),
          el("div", { className: "row", style: "margin-top:10px;" }, [
            el("button", { className: "btn primary", type: "button", text: "Copy board as chat prompt", onClick: copyBoardPrompt }),
          ]),
        ]),
      ]);
    }

    function boardView() {
      return el("div", { className: "board" }, Object.keys(state.board).map((col) =>
        el("div", {
          className: "col",
          onDragover: (e) => { e.preventDefault(); e.currentTarget.classList.add("drag-over"); },
          onDragleave: (e) => e.currentTarget.classList.remove("drag-over"),
          onDrop: (e) => {
            e.preventDefault();
            e.currentTarget.classList.remove("drag-over");
            const id = state.dragId;
            if (!id) return;
            for (const k of Object.keys(state.board)) {
              state.board[k] = state.board[k].filter((x) => x !== id);
            }
            state.board[col].push(id);
            state.dragId = null;
            log("dragend → " + id + " into " + col);
            render();
          },
        }, [
          el("h4", { text: col }),
          ...state.board[col].map((id) => {
            const v = VANS.find((x) => x.id === id);
            return el("div", {
              className: "card",
              draggable: "true",
              onDragstart: () => { state.dragId = id; },
            }, [
              el("strong", { text: id }),
              el("div", { className: "sub", text: v ? v.status + (v.delayMinutes ? ` · ${v.delayMinutes}m` : "") : "" }),
            ]);
          }),
        ])
      ));
    }

    function viewTransitions() {
      return el("div", { className: "panel" }, [
        el("p", { className: "sub", text: "CSS transitions + keyframes, tuned live — same pattern Claude Code docs recommend for exploring easing." }),
        el("div", { className: "motion-stage" }, [el("div", { className: "orb" })]),
        el("div", { className: "row" }, [
          el("label", { className: "ctrl" }, [
            el("span", { text: `Duration ${state.durationMs}ms` }),
            el("input", {
              type: "range", min: "120", max: "1200", step: "20", value: String(state.durationMs),
              onInput: (e) => { state.durationMs = Number(e.target.value); applyMotionVars(); render(); },
            }),
          ]),
          el("label", { className: "ctrl" }, [
            el("span", { text: `Delay ${state.delayMs}ms` }),
            el("input", {
              type: "range", min: "0", max: "600", step: "20", value: String(state.delayMs),
              onInput: (e) => { state.delayMs = Number(e.target.value); applyMotionVars(); render(); },
            }),
          ]),
          el("div", { className: "seg" }, ["ease", "linear", "springy"].map((easing) =>
            el("button", {
              type: "button",
              className: state.easing === easing ? "active" : "",
              text: easing,
              onClick: () => { state.easing = easing; applyMotionVars(); render(); },
            })
          )),
        ]),
        el("p", { className: "callout", style: "margin-top:12px;", text: "Claude Motion (Team/Ent) is a separate first-party template that exports MP4 — not this DIY CSS stage." }),
      ]);
    }

    function viewFollowup() {
      return el("div", { className: "panel split" }, [
        el("div", {}, [
          el("h3", { text: "In-artifact multi-turn" }),
          el("p", { className: "sub", text: "Follow-up context is YOUR job: resend history (and board state) on every call. The API is otherwise stateless." }),
          el("div", { className: "chat" }, state.history.map((m) =>
            el("div", { className: "bubble " + m.role, text: m.content })
          )),
          el("textarea", {
            rows: "3",
            placeholder: "Ask a follow-up…",
            value: state.draft,
            onInput: (e) => { state.draft = e.target.value; },
          }),
          el("div", { className: "row", style: "margin-top:8px;" }, [
            el("button", {
              className: "btn primary", type: "button", disabled: state.busy,
              text: state.busy ? "Calling…" : "Send via complete()",
              onClick: () => { const t = state.draft.trim(); state.draft = ""; callClaudeComplete(t || "Summarize priorities."); },
            }),
            el("button", {
              className: "btn", type: "button", disabled: state.busy,
              text: "Send via Messages fetch",
              onClick: () => { const t = state.draft.trim(); state.draft = ""; callMessagesApi(t || "Give the next action for V-104."); },
            }),
          ]),
        ]),
        el("div", {}, [
          el("h3", { text: "API log" }),
          el("div", { className: "log", text: state.apiLog.join("\n") || "No calls yet." }),
          el("p", { className: "callout", style: "margin-top:10px;", text: "Authoring follow-up (change the artifact code) happens in the host chat — use Copy board as chat prompt on Interactions." }),
        ]),
      ]);
    }

    function viewEvents() {
      return el("div", { className: "panel" }, [
        el("h3", { text: "Dynamic artifact on events" }),
        el("p", { className: "sub", text: "UI reacts to clicks, timers, and (mocked) connector-style refresh. Real Claude Code pages can declare MCP connectors; viewers approve with their own accounts." }),
        el("div", { className: "row" }, [
          el("button", {
            className: "btn primary", type: "button",
            text: "Simulate connector refresh",
            onClick: () => {
              FLEET_SUMMARY.onTimePct = Math.round((86 + Math.random() * 4) * 10) / 10;
              FLEET_SUMMARY.openIncidents = Math.floor(Math.random() * 4);
              state.liveTick += 1;
              log("event:refresh → KPIs mutated (mock)");
              render();
            },
          }),
          el("button", {
            className: "btn", type: "button",
            text: state.autoRefresh ? "Stop interval" : "Start 5s interval",
            onClick: () => {
              state.autoRefresh = !state.autoRefresh;
              if (state.autoRefresh) {
                state._timer = setInterval(() => {
                  state.liveTick += 1;
                  log("event:interval tick " + state.liveTick);
                  render();
                }, 5000);
              } else if (state._timer) {
                clearInterval(state._timer);
              }
              render();
            },
          }),
          el("button", {
            className: "btn", type: "button",
            text: "Ask Claude about current KPIs",
            onClick: () => callMessagesApi(`Live KPIs now: ${JSON.stringify(FLEET_SUMMARY)}. One-sentence briefing.`),
          }),
        ]),
        el("div", { className: "grid kpi", style: "margin-top:14px;" }, [
          kpi("Live tick", String(state.liveTick)),
          kpi("On-time %", FLEET_SUMMARY.onTimePct.toFixed(1)),
          kpi("Incidents", String(FLEET_SUMMARY.openIncidents)),
        ]),
        el("div", { className: "log", style: "margin-top:12px;", text: state.apiLog.join("\n") || "Events will log here." }),
      ]);
    }

    function viewStorage() {
      return el("div", { className: "panel" }, [
        el("h3", { text: "window.storage" }),
        el("p", { className: "sub", text: "Text KV, 20MB/artifact, personal vs shared. Plan-gated (Pro+). Legacy artifacts often no-op until publish." }),
        el("div", { className: "row" }, [
          el("button", { className: "btn primary", type: "button", text: "Save personal", onClick: () => saveStorage(false) }),
          el("button", { className: "btn", type: "button", text: "Load personal", onClick: () => loadStorage(false) }),
          el("button", { className: "btn primary", type: "button", text: "Save shared", onClick: () => saveStorage(true) }),
          el("button", { className: "btn", type: "button", text: "Load shared", onClick: () => loadStorage(true) }),
        ]),
        el("p", { style: "margin-top:12px;", text: state.storageNote || "No storage ops yet." }),
        el("div", { className: "callout", text: "Shared pool has no author/ACL — do not store secrets or PII you would not put on a hallway whiteboard." }),
      ]);
    }

    function render() {
      applyMotionVars();
      // Deep-link hash updates — skip when hosted as about:srcdoc (local preview).
      if (TABS.some((t) => t.id === state.tab) && location.protocol !== "about:") {
        try {
          history.replaceState(null, "", "#" + state.tab);
        } catch (_) {
          /* ignore sandbox / srcdoc history restrictions */
        }
      }
      const root = $("#root");
      root.replaceChildren(
        el("header", { className: "app-head" }, [
          el("div", {}, [
            el("div", { className: "brand", text: "Fleet Ops Artifact Lab" }),
            el("p", { className: "sub", text: "Explore follow-ups, clicks/tooltips, transitions, Claude API responses, and event-driven updates — with mock fleet data and correct Artifact APIs." }),
          ]),
          el("span", { className: "badge", text: "Claude Artifacts exploration" }),
        ]),
        el("nav", { className: "tabs" }, TABS.map((t) =>
          el("button", {
            className: "tab" + (state.tab === t.id ? " active" : ""),
            type: "button",
            text: t.label,
            onClick: () => { state.tab = t.id; render(); },
          })
        )),
        state.tab === "overview" ? viewOverview()
          : state.tab === "interactions" ? viewInteractions()
          : state.tab === "transitions" ? viewTransitions()
          : state.tab === "followup" ? viewFollowup()
          : state.tab === "events" ? viewEvents()
          : viewStorage()
      );
    }

    window.addEventListener("hashchange", () => {
      const id = location.hash.replace("#", "");
      if (TABS.some((t) => t.id === id)) { state.tab = id; render(); }
    });

    applyMotionVars();
    render();
  </script>
</body>
</html>
