apiVersion: semantic-layer/v1
kind: data_source
metadata:
  id: fct_fund_transactions
  name: "Fund Transactions Fact"
  description: |
    One row per transaction. Grain: transaction_id.
  owner: data-eng-team
  status: active

spec:
  type: fact
  location: analytics.marts.fct_fund_transactions
  grain: "one row per transaction_id"
  grain_keys: [transaction_id]

  schema_fields:
    - name: transaction_id
      type: string
      role: key
      exposed: true
    - name: fund_id
      type: string
      role: entity
      exposed: true
    - name: transaction_date
      type: date
      role: time_key
      exposed: true
    - name: transaction_amount
      type: decimal
      role: amount
      exposed: true
    - name: net_transaction_amount
      type: decimal
      role: amount
      exposed: true
    - name: is_test_account
      type: boolean
      role: filter
      exposed: false

  joins:
    - target: dim_fund
      "on": "fund_id = fund_id"
      cardinality: many-to-one
      type: left
      canonical: true
      strategy: full_history
      notes: "Standard conformed dimension join."

    - target: fct_daily_fund_balances
      "on": "fund_id = fund_id, transaction_date = snapshot_date"
      cardinality: many-to-many
      type: inner
      canonical: true
      requires_preaggregation: [self, target]
      notes: "See measures using aggregate_via for the required rollups."
