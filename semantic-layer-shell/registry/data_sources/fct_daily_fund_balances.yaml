apiVersion: semantic-layer/v1
kind: data_source
metadata:
  id: fct_daily_fund_balances
  name: "Daily Fund Balances Fact"
  description: "One row per fund per day."
  owner: data-eng-team
  status: active

spec:
  type: fact
  location: analytics.marts.fct_daily_fund_balances
  grain: "one row per fund_id per snapshot_date"
  grain_keys: [fund_id, snapshot_date]

  schema_fields:
    - name: fund_id
      type: string
      role: entity
      exposed: true
    - name: snapshot_date
      type: date
      role: time_key
      exposed: true
    - name: avg_balance
      type: decimal
      role: amount
      exposed: true

  joins:
    - target: dim_fund
      "on": "fund_id = fund_id"
      cardinality: many-to-one
      type: left
      canonical: true
      strategy: latest_snapshot
