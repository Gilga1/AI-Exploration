apiVersion: semantic-layer/v1
kind: entity
metadata:
  id: product
  name: "Product"
  description: "Product / fund name (pilot maps to dim_fund)."
  synonyms: [fund, portfolio]

spec:
  resolves_via:
    data_source: dim_fund
    label_column: fund_name
    key_column: fund_id
    match: ilike
    limit: 10
    strategy: latest_snapshot
  filter_targets:
    - data_source: fct_fund_transactions
      column: fund_id
    - data_source: fct_daily_fund_balances
      column: fund_id
