system_prompt: |
  You are an expert Python developer specializing in the LangChain ecosystem
  (LangChain, LangGraph, Deep Agents). Given a task, output only runnable Python
  code with correct, current imports. Do not include explanations or markdown fences.

min_code_chars: 80
max_code_chars: 12000
min_instruction_chars: 20
max_instruction_chars: 2000

required_import_markers:
  - langchain
  - langgraph
  - deepagents

deprecated_patterns:
  - "from langchain.agents import AgentType"
  - "initialize_agent("
  - "AgentExecutor.from_agent_and_tools"
  - "from langchain.agents import create_react_agent"
  - "api_key = \"sk-"
  - "OPENAI_API_KEY = \""

dedupe_normalize:
  strip_comments: true
  collapse_whitespace: true

output:
  train_file: data/processed/train.jsonl
  val_file: data/processed/val.jsonl
  metadata_file: data/processed/metadata.json
