# Tier-1 repos for agentic code fine-tuning.
# val_repos are held out entirely for validation splits.

defaults:
  branch: main
  include_globs:
    - "**/*.py"
    - "**/*.ipynb"
  exclude_globs:
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/node_modules/**"
    - "**/build/**"
    - "**/dist/**"
  exclude_path_substrings:
    - "/tests/"
    - "/test_"
    - "_test.py"
    - "/testing/"
    - "/conftest.py"

val_repos:
  - langchain-ai/langgraph-101

repos:
  - name: deepagents
    url: https://github.com/langchain-ai/deepagents.git
    framework: deepagents
    priority: must
    include_paths:
      - examples
      - libs
      - tests

  - name: langgraph
    url: https://github.com/langchain-ai/langgraph.git
    framework: langgraph
    priority: must
    include_paths:
      - examples
      - libs

  - name: langgraph-101
    url: https://github.com/langchain-ai/langgraph-101.git
    framework: langgraph
    priority: must
    include_paths:
      - .

  - name: langchain
    url: https://github.com/langchain-ai/langchain.git
    branch: master
    framework: langchain
    priority: must
    include_paths:
      - libs
      - examples

  - name: deepagents-cookbook
    url: https://github.com/nameissainath/deepagents-langchain-cookbook.git
    framework: deepagents
    priority: high
    include_paths:
      - examples
      - .
