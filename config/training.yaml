model_name: Qwen/Qwen3.5-2B-Instruct
max_seq_length: 2048
load_in_4bit: false
load_in_16bit: true
full_finetuning: false

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth

data:
  train_file: data/processed/train.jsonl
  val_file: data/processed/val.jsonl
  dataset_num_proc: 2

training:
  output_dir: outputs/qwen-agentic-lora
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  num_train_epochs: 2
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  eval_strategy: steps
  save_total_limit: 3
  bf16: true
  optim: adamw_8bit
  seed: 3407
  report_to: none
  max_steps: -1

export:
  merged_dir: outputs/qwen-agentic-merged
  save_merged: true
