[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-eval-harness-backend"
version = "0.1.0"
description = "FastAPI backend for the Agentic RAG Evaluation Harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "langchain>=0.3,<2.0",
  "langgraph>=0.2,<2.0",
  "opentelemetry-sdk>=1.28,<2.0",
  "opentelemetry-exporter-otlp>=1.28,<2.0",
  "deepeval>=1.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
