name: Eval harness CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/eval.yml"

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_DATABASE_URL: sqlite:///./ci_test.db
      APP_LLM_MODEL: openai/gpt-4o-mini
      APP_LLM_BASE_URL: https://openrouter.ai/api/v1
      APP_AUTH_DISABLED: "true"
      APP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,openai]"
      - name: Run unit tests
        run: pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        run: npm ci && npm run build

  deepeval:
    runs-on: ubuntu-latest
    needs: [backend-unit]
    defaults:
      run:
        working-directory: backend
    env:
      APP_DATABASE_URL: sqlite:///./ci_eval.db
      APP_LLM_MODEL: openai/gpt-4o-mini
      APP_LLM_BASE_URL: https://openrouter.ai/api/v1
      APP_AUTH_DISABLED: "true"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend, OpenAI-compatible client, and evaluation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,openai]"
      - name: Require OpenRouter secret on protected branches
        if: github.event.pull_request.base.ref == 'main' && secrets.OPENROUTER_API_KEY == ''
        run: |
          echo "OPENROUTER_API_KEY secret is required to gate merges into main."
          exit 1
      - name: Run golden RAG DeepEval suite
        run: deepeval test run tests/eval/test_rag_metrics.py
