extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # P6-T1 tail sampling: always keep error traces, sample healthy traffic.
  # Policies are evaluated in order; a trace matching any "keep" rule wins.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-traces
        type: latency
        latency:
          threshold_ms: 2000   # Slow runs are always worth investigating.
      - name: sample-healthy-traffic
        type: probabilistic
        probabilistic:
          sampling_percentage: 15

exporters:
  debug:
    verbosity: basic
  # P6-T4 storage path: spans land in Postgres via the backend's consumer or,
  # at higher volume, here via the clickhouse exporter (uncomment to enable).
  # clickhouse:
  #   endpoint: tcp://clickhouse:9000
  #   database: traces

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling]
      exporters: [debug]
