services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentic_rag_eval
      POSTGRES_USER: agentic_rag
      POSTGRES_PASSWORD: agentic_rag_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_rag -d agentic_rag_eval"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      # The official Collector image is `scratch`-based, so use its binary
      # directly rather than relying on shell tools such as wget or curl.
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
